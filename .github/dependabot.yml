version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor + patch together in one PR; majors arrive individually.
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
